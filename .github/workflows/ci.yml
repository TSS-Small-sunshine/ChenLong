name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare writable data directory
        run: mkdir -p data && chmod 777 data

      - name: Prepare temporary .env
        run: |
          cat > .env <<EOF
          SESSION_SECRET=$(openssl rand -hex 32)
          ENCRYPTION_KEY=$(openssl rand -hex 32)
          ADMIN_USERNAME=admin
          ADMIN_PASSWORD=AdminPass123
          POSTGRES_USER=chenlong
          POSTGRES_PASSWORD=ci_pg_password
          POSTGRES_DB=chenlong
          EOF

      - name: Validate compose file
        run: docker compose config -q

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for application health
        run: |
          ok=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
              ok=1
              echo "API 健康检查通过（${i}s）"
              break
            fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            echo "错误：应用在 90 秒内未通过 /api/health 健康检查"
            exit 1
          fi
          curl -fsS http://127.0.0.1:3000/api/health

      - name: Verify pg_dump backup
        run: |
          docker compose exec -T app node scripts/backup-db.js
          docker compose exec -T app sh -c 'ls -l /app/data/backups/ && head -n 2 /app/data/backups/*.sql'

      - name: Show stack status
        if: always()
        run: docker compose ps

      - name: Show stack logs
        if: always()
        run: docker compose logs

      - name: Stop stack
        if: always()
        run: docker compose down -v

      - name: Remove temporary .env
        if: always()
        run: rm -f .env
