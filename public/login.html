<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#65BFFF">
  <meta name="description" content="登录尘龙 ChenLong，继续和你的 AI 小龙聊天。">
  <title>登录 · 尘龙 ChenLong</title>
  <link rel="stylesheet" href="css/common.css">
</head>
<body class="auth-page">
  <div class="cl-sky" aria-hidden="true">
    <span class="cl-sky__blob cl-sky__blob--1"></span>
    <span class="cl-sky__blob cl-sky__blob--2"></span>
    <span class="cl-sky__blob cl-sky__blob--3"></span>
  </div>

  <main class="auth">
    <a class="cl-logo" href="index.html" aria-label="尘龙 ChenLong 首页">
        <span class="cl-logo__mark" aria-hidden="true"><img class="cl-logo__img" data-site-logo alt="" hidden></span>
        <span class="cl-logo__text" data-site-name>尘龙<em>ChenLong</em></span>
      </a>

    <p class="auth__brand-sub" data-site-subtitle>Your Little AI Companion</p>

    <section class="cl-card cl-card--glass auth__card" aria-labelledby="login-title">
      <div class="auth__head">
        <h1 id="login-title">欢迎回来</h1>
        <p>登录后继续和尘龙聊天，历史对话会保存在你的账号下。</p>
      </div>

      <form class="cl-form" data-auth-form="login" novalidate>
        <div class="cl-field">
          <label class="cl-label" for="username">用户名<span class="cl-req" aria-hidden="true">*</span></label>
          <input class="cl-input" id="username" name="username" type="text" autocomplete="username" placeholder="请输入用户名">
          <p class="cl-hint" id="login-username-hint">3–24 位字符</p>
        </div>

        <div class="cl-field">
          <div class="cl-row cl-row--between">
            <label class="cl-label" for="password">密码<span class="cl-req" aria-hidden="true">*</span></label>
            <a class="cl-small" href="#" data-pending="找回密码">忘记密码？</a>
          </div>
          <div class="cl-input-affix">
            <input class="cl-input" id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码">
            <button class="cl-pw-toggle" type="button" data-toggle-password="#password" aria-label="显示密码" aria-pressed="false"></button>
          </div>
          <p class="cl-hint" id="login-password-hint">至少 6 位字符</p>
        </div>

        <label class="cl-check" for="remember">
          <input id="remember" name="remember" type="checkbox" checked>
          <span>记住我（7 天内免登录）</span>
        </label>

        <button class="cl-btn cl-btn--primary cl-btn--lg cl-btn--block" type="submit">登录</button>
      </form>

      <p class="auth__switch">还没有账号？<a href="register.html">创建一个</a></p>
      <p class="auth__note">登录状态由服务端 Cookie 维护；忘记密码请联系管理员重置。</p>
    </section>

    <a class="auth__back" href="index.html">← 返回首页</a>
  </main>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
