<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#65BFFF">
  <meta name="description" content="尘龙 ChenLong 后台：查看会话列表与消息记录。">
  <title>聊天数据 · 尘龙 ChenLong 后台</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body data-guard="admin">
  <div class="admin-shell">
    <aside class="admin-nav" id="admin-nav" aria-label="后台导航">
      <a class="admin-nav__brand" href="admin.html" aria-label="尘龙 ChenLong 后台首页">
        <span class="cl-logo">
          <span class="cl-logo__mark" aria-hidden="true"></span>
          <span class="cl-logo__text">尘龙<em>ChenLong</em></span>
        </span>
        <span class="admin-nav__badge">ADMIN</span>
      </a>

      <p class="admin-nav__group">概览</p>
      <a class="admin-nav__link" href="admin.html"><span class="admin-nav__icon admin-nav__icon--dash" aria-hidden="true"></span>仪表盘</a>

      <p class="admin-nav__group">服务</p>
      <a class="admin-nav__link" href="api.html"><span class="admin-nav__icon admin-nav__icon--api" aria-hidden="true"></span>API 管理</a>
      <a class="admin-nav__link" href="models.html"><span class="admin-nav__icon admin-nav__icon--model" aria-hidden="true"></span>模型管理</a>

      <p class="admin-nav__group">运营</p>
      <a class="admin-nav__link" href="users.html"><span class="admin-nav__icon admin-nav__icon--user" aria-hidden="true"></span>用户管理</a>
      <a class="admin-nav__link is-active" href="data.html" aria-current="page"><span class="admin-nav__icon admin-nav__icon--data" aria-hidden="true"></span>聊天数据</a>

      <p class="admin-nav__group">系统</p>
      <a class="admin-nav__link" href="settings.html"><span class="admin-nav__icon admin-nav__icon--setting" aria-hidden="true"></span>系统设置</a>

      <div class="admin-nav__foot">
        <a class="admin-nav__link" href="../index.html"><span class="admin-nav__icon admin-nav__icon--back" aria-hidden="true"></span>返回前台</a>
        <button class="cl-btn cl-btn--ghost cl-btn--sm" type="button" data-logout>退出登录</button>
        <div class="admin-nav__user">
          <span class="cl-avatar cl-avatar--sm" aria-hidden="true" data-user-avatar>尘</span>
          <div class="admin-nav__user-meta">
            <div class="admin-nav__user-name" data-user-nickname>未登录管理员</div>
            <div class="admin-nav__user-role" data-user-role>管理员</div>
          </div>
        </div>
      </div>
    </aside>
    <div class="admin-main">
      <header class="admin-topbar">
        <button class="admin-topbar__toggle" type="button" data-admin-toggle aria-label="打开后台导航" aria-expanded="false" aria-controls="admin-nav"><span aria-hidden="true"></span></button>
        <nav class="admin-topbar__crumb" aria-label="面包屑">
          <a href="admin.html">后台</a>
          <span aria-hidden="true">/</span>
          <strong>聊天数据</strong>
        </nav>
        <div class="admin-topbar__right">
          <a class="cl-btn cl-btn--ghost cl-btn--xs" href="../index.html">返回前台</a>
          <span class="cl-avatar cl-avatar--sm" aria-hidden="true" data-user-avatar>尘</span>
        </div>
      </header>
      <main class="admin-content">
        <header class="admin-page-head">
          <div class="admin-page-head__text">
            <h1>聊天数据</h1>
            <p>按会话查看聊天记录概况，点击会话可查看完整消息。</p>
          </div>
          <div class="admin-page-head__actions">
            <button class="cl-btn cl-btn--ghost" type="button" data-conv-refresh>刷新数据</button>
          </div>
        </header>

        <section class="cl-panel">
          <div class="cl-panel__head">
            <div>
              <h2 class="cl-card__title">会话列表</h2>
              <p class="cl-card__sub">管理员只读查看，不提供删除操作</p>
            </div>
            <span class="cl-tag cl-tag--off" data-conv-count>0 个会话</span>
          </div>
          <div class="cl-panel__body">
            <div class="admin-toolbar">
              <div class="cl-search">
                <input class="cl-input" type="search" placeholder="搜索会话标题或用户名" aria-label="搜索会话" data-conv-keyword autocomplete="off">
              </div>
            </div>
            <div class="cl-table-wrap">
              <table class="cl-table">
                <thead>
                  <tr>
                    <th scope="col">会话标题</th>
                    <th scope="col">所属用户</th>
                    <th scope="col">消息数</th>
                    <th scope="col">模型</th>
                    <th scope="col">创建时间</th>
                    <th scope="col">最近活动</th>
                    <th scope="col">操作</th>
                  </tr>
                </thead>
                <tbody data-conv-rows>
                  <tr class="cl-table__empty">
                    <td colspan="7">
                      <div class="admin-table-state">正在加载会话…</div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div class="admin-pager">
              <span class="admin-pager__info" data-conv-pageinfo>第 1/1 页 · 共 0 条</span>
              <div class="admin-pager__actions">
                <button class="cl-btn cl-btn--ghost cl-btn--sm" type="button" data-conv-prev disabled>上一页</button>
                <button class="cl-btn cl-btn--ghost cl-btn--sm" type="button" data-conv-next disabled>下一页</button>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div class="cl-modal cl-modal--drawer" id="conv-drawer" role="dialog" aria-modal="true" aria-labelledby="conv-drawer-title" aria-hidden="true">
    <div class="cl-modal__backdrop" data-modal-close></div>
    <div class="cl-modal__panel admin-drawer__panel">
      <div class="cl-modal__head">
        <div>
          <h2 class="cl-modal__title" id="conv-drawer-title" data-drawer-title>会话消息</h2>
          <p class="cl-modal__sub" data-drawer-sub>正在加载消息…</p>
        </div>
        <button class="cl-modal__close" type="button" data-modal-close aria-label="关闭"></button>
      </div>
      <div class="cl-modal__body">
        <div class="admin-messages" data-drawer-messages></div>
        <div class="admin-pager admin-pager--compact">
          <span class="admin-pager__info" data-drawer-pageinfo>第 1/1 页 · 共 0 条</span>
          <div class="admin-pager__actions">
            <button class="cl-btn cl-btn--ghost cl-btn--xs" type="button" data-drawer-prev disabled>上一页</button>
            <button class="cl-btn cl-btn--ghost cl-btn--xs" type="button" data-drawer-next disabled>下一页</button>
          </div>
        </div>
      </div>
      <div class="cl-modal__foot">
        <button class="cl-btn cl-btn--ghost" type="button" data-modal-close>关闭</button>
      </div>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/guard.js"></script>
  <script src="../js/admin.js"></script>
  <script src="../js/admin-data.js"></script>

</body>
</html>
